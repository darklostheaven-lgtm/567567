
name: Распаковка проекта 2000 YARDOV

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Распаковать архив проекта
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Архив проекта не найден!"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          cp -a extracted/. .
          rm -rf extracted

          # Удаляем старый конфликтующий сценарий сборки
          rm -f .github/workflows/android.yml

      - name: Сохранить распакованные файлы
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add -A
          git commit -m "Распаковка проекта 2000 YARDOV" || echo "Нет изменений"
          git push
