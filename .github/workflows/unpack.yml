
name: Распаковка архива проекта

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Распаковать ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Архив не найден!"
            exit 1
          fi

          mkdir -p unpacked
          unzip -o "$ZIP_FILE" -d unpacked

          cp -a unpacked/. .
          rm -rf unpacked

      - name: Сохранить распакованные файлы
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Автоматическая распаковка проекта [skip ci]" || echo "Нет изменений"
          git push
